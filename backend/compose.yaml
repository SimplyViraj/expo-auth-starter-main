services:
  db:
    image: postgres:17-alpine
    environment:
      # Local development only; these match .env.example.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expo_auth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expo_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
